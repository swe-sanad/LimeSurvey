name: Build image & deploy to surveys.swe.com.ly

# Tag-triggered deploy: push a tag like `deploy-v3` (or run manually) and this builds the image,
# pushes it to GHCR, then calls the platform deploy webhook which does `docker compose pull && up -d`
# on the box. Replaces the manual build.sh + ssh-script flow.
#
# One-time arming (see deploy/README.md "Tag-based deploy"):
#   1. On the box:  sudo python3 /opt/platform/deploy/deploy-register.py add limesurvey \
#                      /opt/apps/limesurvey/app --image ghcr.io/swe-sanad/limesurvey:latest
#      -> copy the printed token into this repo's Actions secret DEPLOY_TOKEN.
#   2. Point /opt/apps/limesurvey/app/docker-compose.yml at  image: ghcr.io/swe-sanad/limesurvey:latest
#   3. Make the GHCR package public (Packages -> limesurvey -> visibility) OR register private pull
#      creds with `deploy-register.py set-ghcr limesurvey <user> <pat>`.

on:
  push:
    tags:
      - 'deploy-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-swe-limesurvey
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deploy/Dockerfile does `COPY src/ /var/www/html/`; stage the checkout into deploy/src the
      # same way deploy/build.sh does, so CI and the manual build produce the same image.
      - name: Stage source into deploy/src
        run: |
          mkdir -p deploy/src
          rsync -a --exclude='.git/' --exclude='deploy/' ./ deploy/src/

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/swe-sanad/limesurvey:latest
            ghcr.io/swe-sanad/limesurvey:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fire the platform deploy webhook (Option A: CI Bearer). The receiver runs redeploy.sh =
      # `docker compose pull && up -d` in /opt/apps/limesurvey/app. X-GHCR-Token lets the box pull a
      # PRIVATE image with this run's token; harmless if the package is public.
      - name: Trigger box redeploy
        run: |
          curl -fsS -X POST "https://deploy.swe.com.ly/hooks/redeploy?name=limesurvey" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "X-GHCR-Token: ${{ secrets.GITHUB_TOKEN }}"
